name: AlphaFeed news bot

on:
  schedule:
    # Раз в час. Вместе с MAX_POSTS_PER_RUN=4 это даёт максимум 4 поста в час.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write   # нужно, чтобы бот мог сохранять posted.json обратно в репозиторий

# Если предыдущий запуск завис — он ОТМЕНЯЕТСЯ, и новый стартует.
# Раньше стояло false: подвисший job блокировал все последующие
# запуски, и канал замолкал на часы.
concurrency:
  group: alphafeed-news
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # запуск живёт почти час, растягивая публикации
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS_PER_RUN: "4"     # максимум постов за один запуск
          TOP_ONLY: "true"           # только важные новости, без периферии
          SPREAD_MINUTES: "40"       # окно, внутри которого разносятся публикации
          MIN_GAP_MINUTES: "10"      # минимальный разрыв между постами
        run: python -u fetch_and_post.py

      # if: always() — состояние сохраняется даже если скрипт упал,
      # иначе после каждой ошибки бот заново перебирал бы те же новости
      - name: Save posted.json back to repo
        if: always()
        run: |
          git config user.name "alphafeed-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --staged --quiet && echo "нет изменений" && exit 0
          git commit -m "update posted state"
          # подтягиваем чужие изменения, чтобы push не отвалился
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push || echo "push не удался, состояние сохранится в следующий раз"
