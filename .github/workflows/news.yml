name: AlphaFeed news bot

on:
  schedule:
    # Раз в час. Вместе с MAX_POSTS_PER_RUN=5 это даёт максимум 5 постов в час.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write   # нужно, чтобы бот мог сохранять posted.json обратно в репозиторий

# Если предыдущий часовой запуск ещё не закончился — новый не стартует,
# чтобы посты не наложились друг на друга.
concurrency:
  group: alphafeed-news
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 70   # запуск живёт почти час, растягивая публикации
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS_PER_RUN: "2"     # максимум постов за один запуск
          TOP_ONLY: "true"           # только важные новости, без периферии
          SPREAD_MINUTES: "55"       # окно, внутри которого разносятся публикации
          MIN_GAP_MINUTES: "25"      # минимальный разрыв между постами
        run: python fetch_and_post.py

      - name: Save posted.json back to repo
        run: |
          git config user.name "alphafeed-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted state"
          git push