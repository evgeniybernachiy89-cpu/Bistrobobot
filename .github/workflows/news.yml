name: AlphaFeed news bot

on:
  schedule:
    # Каждые 30 минут. Время в UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write   # нужно, чтобы бот мог сохранять posted.json обратно в репозиторий

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_and_post.py

      - name: Save posted.json back to repo
        run: |
          git config user.name "alphafeed-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted state"
          git push