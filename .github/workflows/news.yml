name: AlphaFeed news bot

on:
  schedule:
    # Каждые 15 минут по одному посту = до 4 постов в час.
    # Короткие запуски намного надёжнее часовых: пропуск одного
    # запуска стоит одного поста, а не целого часа тишины.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write   # нужно, чтобы бот мог сохранять posted.json обратно в репозиторий

# Запуски короткие (1-3 минуты), пересекаться им негде.
concurrency:
  group: alphafeed-news
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # запуск короткий: собрать, перевести, отправить
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS_PER_RUN: "1"     # один пост за запуск (запуск каждые 15 мин)
          TOP_ONLY: "true"           # только важные новости, без периферии
          JITTER_MAX_MINUTES: "7"    # случайная задержка, чтобы время выхода "плавало"
        run: python -u fetch_and_post.py

      # if: always() — состояние сохраняется даже если скрипт упал,
      # иначе после каждой ошибки бот заново перебирал бы те же новости
      - name: Save posted.json back to repo
        if: always()
        run: |
          git config user.name "alphafeed-bot"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --staged --quiet && echo "нет изменений" && exit 0
          git commit -m "update posted state"
          # подтягиваем чужие изменения, чтобы push не отвалился
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push || echo "push не удался, состояние сохранится в следующий раз"
