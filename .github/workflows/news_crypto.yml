name: Zerno crypto news

on:
  schedule:
    # НЕ круглые минуты: на :00/:15/:30 приходится пик нагрузки на
    # планировщик GitHub, и бесплатные задачи там часто отбрасываются.
    # Смещение на 3/18/33/48 заметно повышает шанс запуска.
    # Крипта: две метки в час + дублирующая страховка.
    - cron: "4,34 * * * *"
    - cron: "11,41 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write   # нужно, чтобы бот мог сохранять posted.json обратно в репозиторий

# Запуски короткие (1-3 минуты), пересекаться им негде.
concurrency:
  group: zerno-crypto
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # запуск короткий: собрать, перевести, отправить
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: "crypto"            # только крипто-новости
          STATE_FILE: "posted_crypto.json"
          MAX_POSTS_PER_RUN: "3"
          POSTS_PER_HOUR: "2"        # 2 крипто-поста в час
          TOP_ONLY: "true"           # только важные новости, без периферии
          JITTER_MAX_MINUTES: "7"    # случайная задержка, чтобы время выхода "плавало"
        run: python -u fetch_and_post.py

      # if: always() — состояние сохраняется даже если скрипт упал,
      # иначе после каждой ошибки бот заново перебирал бы те же новости
      - name: Save posted.json back to repo
        if: always()
        run: |
          git config user.name "alphafeed-bot"
          git config user.email "actions@github.com"
          git add posted_crypto.json
          git diff --staged --quiet && echo "нет изменений" && exit 0
          git commit -m "update posted state"
          # подтягиваем чужие изменения, чтобы push не отвалился
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push || echo "push не удался, состояние сохранится в следующий раз"