name: Zerno crypto news

on:
  schedule:
    # Крипта: 2 поста в час + страховка.
    # Задачи разнесены с шагом 6 минут, чтобы их запуски не
    # накладывались и не конфликтовали при сохранении состояния.
    - cron: "2,32 * * * *"
    - cron: "8,38 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write   # нужно, чтобы бот мог сохранять posted.json обратно в репозиторий

# Запуски короткие (1-3 минуты), пересекаться им негде.
concurrency:
  group: zerno-crypto
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # запуск короткий: собрать, перевести, отправить
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: "crypto"            # только крипто-новости
          STATE_FILE: "posted_crypto.json"
          MAX_POSTS_PER_RUN: "3"
          POSTS_PER_HOUR: "2"        # 2 крипто-поста в час
          MAX_AGE_HOURS: "12"        # не публиковать новости старше 12 часов
          TOP_ONLY: "true"           # только важные новости, без периферии
          JITTER_MAX_MINUTES: "7"    # случайная задержка, чтобы время выхода "плавало"
        run: python -u fetch_and_post.py

      # if: always() — состояние сохраняется даже если скрипт упал,
      # иначе после каждой ошибки бот заново перебирал бы те же новости
      # Состояние обязано попасть в репозиторий: иначе следующий запуск
      # не узнает о публикации и выдаст дубль. Три задачи пушат в один
      # репозиторий, поэтому конфликты штатны — делаем несколько попыток.
      - name: Save state back to repo
        if: always()
        run: |
          git config user.name "zerno-bot"
          git config user.email "actions@github.com"
          git add posted_crypto.json
          if git diff --staged --quiet; then
            echo "нет изменений состояния"
            exit 0
          fi
          git commit -m "state: posted_crypto.json"
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            # свои изменения важнее: при конфликте оставляем нашу версию
            git rebase -X ours "origin/$GITHUB_REF_NAME" || git rebase --abort
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "состояние сохранено с попытки $i"
              exit 0
            fi
            echo "попытка $i не удалась, жду..."
            sleep $((RANDOM % 10 + 3))
          done
          echo "::error::НЕ УДАЛОСЬ сохранить состояние — возможны дубли"
          exit 1
